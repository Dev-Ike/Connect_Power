<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect Power — Admin Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --green-deep:#0B3B24;--green:#146B3A;--green-light:#E9F5EC;--gold:#F2B705;
    --ink:#132018;--muted:#5B6B60;
    font-family:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--green-light);color:var(--ink);line-height:1.5;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:28px 5vw;
  }
  h1,.step-title{font-family:'Poppins',system-ui,sans-serif;}
  .step-card{
    width:100%;max-width:380px;
    background:linear-gradient(160deg,var(--green-deep),var(--green));
    border-radius:22px;padding:6px;
  }
  .step-title{padding:20px 26px;font-size:1.2rem;font-weight:700;color:#fff;}
  .step-title span{color:var(--gold);}
  .inner{background:#fff;border-radius:18px;padding:30px 26px;}
  .field{margin-bottom:16px;text-align:left;}
  .field label{display:block;font-size:.8rem;font-weight:600;color:var(--green-deep);margin-bottom:6px;}
  .field input{
    width:100%;padding:12px 14px;border-radius:9px;border:1.5px solid var(--green);
    font-size:.92rem;font-family:inherit;color:var(--ink);
  }
  .field input:focus{outline:2px solid var(--gold);outline-offset:1px;}
  .login-btn{
    width:100%;background:var(--gold);color:var(--green-deep);
    padding:14px;border-radius:10px;border:none;
    font-weight:700;font-size:.95rem;cursor:pointer;
  }
  .error-msg{color:#B3261E;font-size:.84rem;min-height:1.2em;margin-top:10px;text-align:center;}
  .back-link{display:block;margin-top:16px;font-size:.85rem;color:var(--muted);text-decoration:none;text-align:center;}
</style>
</head>
<body>

<div class="step-card">
  <div class="step-title"><span>🔐</span> Admin Login</div>
  <div class="inner">
    <form id="admin-login-form">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" type="text" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="login-btn" id="login-btn">LOG IN →</button>
      <p id="error" class="error-msg"></p>
    </form>
    <a href="index.html" class="back-link">← Back to home</a>
  </div>
</div>

<script>
  document.getElementById('admin-login-form').addEventListener('submit', function (e) {
    e.preventDefault();
    const errBox = document.getElementById('error');
    const btn = document.getElementById('login-btn');
    errBox.textContent = '';
    btn.disabled = true;

    fetch('/api/admin-login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value
      })
    })
      .then(res => res.json())
      .then(data => {
        btn.disabled = false;
        if (data.success) {
          // Keep the signed token as a fallback for browsers that drop the cookie.
          if (data.token) {
            try { localStorage.setItem('cp_admin_token', data.token); } catch (e) {}
          }
          window.location.href = 'admin-dashboard.html';
        } else {
          errBox.textContent = data.message || 'Wrong username or password.';
        }
      })
      .catch(() => {
        btn.disabled = false;
        errBox.textContent = 'Could not reach the server. Please check your connection and try again.';
      });
  });
</script>
</body>
</html>
